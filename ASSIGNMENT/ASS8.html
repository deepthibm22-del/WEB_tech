<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
       *{
          margin:0px;
          padding:0px;
          box-sizing: border-box;
        }
        .page{
            height: 100vh;
            width: 100vw;
        }
        h1{
            font-size:60px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
        }
        #page1{
            background-color: rgb(214, 59, 59);
            
        }
         #page2{
            background-color: blueviolet;
         }

         #page3{
            background-color: hsl(309, 58%, 64%);
        
        }
         #page4{
            background-color: pink;
        }
        .chatbot{
            background-color: black;
            color:aliceblue;
            height:100px;
            width:100px;
            border-radius:50%;
            position:fixed;
            bottom:20px;
            right:20px;
            text-align:center;
            background-image:url("gif1.gif");
            background-repeat:no-repeat;
            background-size: cover;

        }
        .textbox{
            
            width:200px;
            border-radius:10px;
            background-color: rgb(199, 184, 164);
            position:sticky;
            right:120px;
            text-align:center;

        }
        .halffix{
            width:100vw;
            height:150vh;
            position:absolute;
            top:150vh;
        }
        #chatbot1{
            position:sticky;
            top:20px;
            left:970px;
        }
        #textbox1{
            position:sticky;
            top:20px;
            left: 760px;
        }

        

        
    </style>
</head>
<body>
    
    <div class="page"id="page1"><h1>PAGE1</h1></div>

    <div class="halffix">
    <div class="chatbot" id="chatbot1"></div>
    <div class="textbox" id="textbox1">hello👋<br>how are you<br>hows your day😎<br>----------------</div>
    </div>

    <div class="page"id="page2"><h1>PAGE2</h1></div>
    <div class="page"id="page3"><h1>PAGE3</h1></div>
    <div class="page"id="page4"><h1>PAGE4</h1></div>
    

    </div>
</body>
</html>
