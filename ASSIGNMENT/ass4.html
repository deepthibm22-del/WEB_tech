<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:600px;
            height:500px;
            border: 5px solid blue;
            position:relative;
        }
        .box{
           width:100px;
            height:100px;
            border: 3px solid blue;
        }
         #box1{
             position:static;
             
             /* bottom: -80px; */
            
         }
         #box2{
             position:absolute;
             left: 500px; 
             top:00px;
         }
         #box3{
             position:relative;
             left:250px;
             bottom:-85px;
             
         }
         #box4{
             position:absolute;
             right: 500px; 
             bottom: 00px;
         }
         #box5{
             position:absolute;
             left: 500px;
             bottom: 00px;
         }
         
    </style>
</head>
<body>
    <div class="container">
     <div class="box" id="box1">box1</div>
     <div class="box" id="box2">box2</div>
     <div class="box" id="box3">box3</div>
     <div class="box" id="box4">box4</div>
     <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
