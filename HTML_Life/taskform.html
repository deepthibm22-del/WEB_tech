<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <ul>
            <li> <label>Name:</label>
                <input id="Name" type="text" name="Name"><br><br>
            </li>
            <li> <label>Email:</label>
                <input id="Email" type="email" name="Email"><br><br>
            </li>
            <li> <label>Password:</label>
                <input id="Password" type="password" name="Password"><br><br>
            </li>
            <li>
                Please check all the emotions that apply to you:<br>
                <ul>
                    <li>
                        <label>Angry</label>
                        <input type="checkbox" name="emotions">
                    </li>
                    <li>
                        <label>Happy</label>
                        <input type="checkbox" name="emotions">
                    </li>
                    <li>
                        <label>Sad</label>
                        <input type="checkbox" name="emotions">
                    </li>
                    <li>
                        <label>Ambivalent</label>
                        <input type="checkbox" name="emotions">
                    </li>
                </ul><br>
            <li>
                How satisfied were you with our service?<br>
                <ul>
                    <li>
                        <label>Very satisfied</label>
                        <input type="radio" name="satisfaction">
                    </li>
                    <li>
                        <label>Satisfied</label>
                        <input type="radio" name="satisfaction">
                    </li>
                    <li>
                        <label>Didn't care</label>
                        <input type="radio" name="satisfaction">
                    </li>
                    <li>
                        <label>Dissatisfied</label>
                        <input type="radio" name="satisfaction">
                    </li>
                    <li>
                        <label> Very dissatisfied</label>
                        <input type="radio" name="satisfaction">
                    </li>

                </ul><br>
            <li>
                <label>Further comments:</label>
                <textarea name="comments"></textarea>
            </li><br>
            <li>
                <button> submit</button>

            </li>


        </ul>
    </form>
</body>

</html>
