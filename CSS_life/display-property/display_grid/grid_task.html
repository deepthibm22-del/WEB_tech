<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    .container{
            height: 800px;
            border: 3px solid black;
            display: grid;
            grid-template-columns: 100px 200px 250px;
            gap: 10px;
            justify-content: center;
    }
     .box{
            padding: 10px;
            border:1px solid black;
     }
     #box1{
        grid-column: 1/4;
        background-color: crimson;
     }

      #box2{
        grid-row: 2/4;
        background-color:blueviolet;
     }
      #box3{
        /* grid-column: 1/4; */
        background-color:rgb(92, 49, 232);
     }
      #box4{
        grid-column: 3/4;
        background-color:#83dbef;
     }
      #box5{
        grid-column: 2/4;
        background-color: rgb(201, 75, 201);
     }
      #box6{
        grid-column: 1/3;
        background-color: red;
     }
      #box7{
        grid-column: 3/4;
        background-color: rgb(79, 79, 129);
     }
      #box8{
        grid-column: 1/4;
        background-color:rgb(75, 75, 205);
     }
</style>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
        <div class="box"id="box5">5</div>
        <div class="box"id="box6">6</div>
        <div class="box"id="box7">7</div>
        <div class="box"id="box8">8</div>
   </div>
        
</body>
</html>
</body>
</html>
