<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width:800px;
            height: 400px;
            border: 2px solid purple;
        }
        .child{
            display:inline-block;block level will start from new line so when we add inline-block dispaly it wil not start from new line
            width: 140px;
            height: 140px;
            background-color: orange;

        }
        span{
            width: 140px;
            height: 140px;
            background-color: greenyellow;
            display: inline-block;
            /*in inline will not accept height and width so when we give design-inline-block  it will accept height and width*/
        }
    </style>
</head>
<body>
    <div class="main">
   <div class="child">block1</div>
   <div class="child">block2</div>
   <span>inline1</span>
   <span>inline2</span>
   </div>
   
</body>
</html>
