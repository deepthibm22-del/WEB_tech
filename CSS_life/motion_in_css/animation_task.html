<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     *{
            margin: 0px;
            padding: 0px;
            background-color: black;
        }
        body{
            height:100vh;
            width:100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .mainbox{
            height: 400px;
            width: 400px;
            border: 3px solid white;
            box-shadow: 2px 2px 2px 2px;
            border-radius: 50%;
            position: relative;
            animation: bhooth 3s infinite linear;
            
        }
        .childbox{
            width:70px;
            height:70px;
            background-color:gold;
            position: absolute;
            top:60px;
            border-radius: 50%;
            box-shadow:3px 3px 12px  gold ;
        }
       @keyframes bhooth {
        0%{
            transform: rotate(0deg);

        }
        100%{
            transform: rotate(360deg);

        }
        
       }

         </style>   
</head>
<body>
    <div class="mainbox">
        <div class="childbox">
           
        </div>
    </div>
</body>
</html>
